<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — Stasha Interior</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#B8965A;--gold-light:#D4AF72;
  --dark:#231F1A;--dark2:#2C2721;--dark3:#37312A;
  --cream:#F9F5EE;--warm:#E8DEC8;--text-muted:#AFA48F;
  --error:#C4645A;
}
body{
  background:var(--dark);color:var(--cream);
  font-family:'Montserrat',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;
}
.login-box{
  width:100%;max-width:400px;
  background:var(--dark2);
  border:1px solid rgba(184,150,90,0.15);
  padding:3rem 2.5rem;
}
.logo-mark{
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem;font-weight:300;letter-spacing:0.22em;
  color:var(--gold-light);text-align:center;margin-bottom:0.3rem;
}
.logo-mark span{font-style:italic;color:var(--cream);}
.admin-tag{
  text-align:center;font-size:0.68rem;letter-spacing:0.25em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:2.5rem;
}
label{
  display:block;font-size:0.7rem;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.6rem;
}
input[type="password"]{
  width:100%;background:var(--dark);border:1px solid rgba(184,150,90,0.25);
  color:var(--cream);padding:0.85rem 1rem;font-size:0.95rem;
  font-family:'Montserrat',sans-serif;margin-bottom:1.5rem;
  transition:border-color 0.3s;
}
input[type="password"]:focus{outline:none;border-color:var(--gold);}
button{
  width:100%;background:var(--gold);color:var(--dark);border:none;
  padding:0.9rem;font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;
  font-family:'Montserrat',sans-serif;font-weight:500;cursor:pointer;
  transition:background 0.3s;
}
button:hover{background:var(--gold-light);}
button:disabled{opacity:0.6;cursor:not-allowed;}
.error-msg{
  color:var(--error);font-size:0.8rem;margin-top:1rem;text-align:center;
  display:none;
}
.error-msg.visible{display:block;}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-mark">Stasha <span>Interior</span></div>
  <div class="admin-tag">Admin Dashboard</div>

  <form id="loginForm">
    <label for="password">Password</label>
    <input type="password" id="password" required autofocus/>
    <button type="submit" id="loginBtn">Sign In</button>
    <div class="error-msg" id="errorMsg">Invalid password. Please try again.</div>
  </form>
</div>

<script>
const API_BASE = "http://127.0.0.1:5000";

const form = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");
const loginBtn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;

  errorMsg.classList.remove("visible");
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";

  try {
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Login failed");
    }

    // Store token so other admin pages can use it
    localStorage.setItem("stasha_admin_token", data.token);
    window.location.href = "dashboard.html";

  } catch (err) {
    errorMsg.classList.add("visible");
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }
});
</script>

</body>
</html>
